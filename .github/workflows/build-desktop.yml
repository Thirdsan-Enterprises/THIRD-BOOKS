name: Build Desktop App (Flutter)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0-dev'

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            name: Linux
          - os: windows-latest
            platform: windows
            name: Windows
          - os: macos-latest
            platform: macos
            name: macOS

    runs-on: ${{ matrix.os }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Enable desktop support
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Get dependencies
        working-directory: mobile-admin
        run: flutter pub get

      - name: Generate code (if using build_runner)
        working-directory: mobile-admin
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: mobile-admin
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: mobile-admin
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        working-directory: mobile-admin
        run: flutter build macos --release

      - name: Prepare Linux artifact
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          cd mobile-admin/build/linux/x64/release/bundle
          tar -czvf ../../../../../artifacts/thirdbooks-linux-x64.tar.gz .

      - name: Prepare Windows artifact
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cd mobile-admin/build/windows/x64/runner/Release
          7z a -tzip ../../../../../artifacts/thirdbooks-windows-x64.zip .

      - name: Prepare macOS artifact
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          cd mobile-admin/build/macos/Build/Products/Release
          zip -r ../../../../../artifacts/thirdbooks-macos.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-desktop-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # ThirdBooks Desktop App ${{ github.ref_name }}

            Professional accounting management system for Uganda and East Africa.

            ## Downloads

            - **Linux**: `thirdbooks-linux-x64.tar.gz`
            - **Windows**: `thirdbooks-windows-x64.zip`
            - **macOS**: `thirdbooks-macos.zip`

            ## Features

            - Offline-first architecture
            - Multi-currency support (UGX base)
            - Double-entry bookkeeping
            - Financial reports
            - Cloud sync when online

            ## Installation

            ### Linux
            ```bash
            tar -xzvf thirdbooks-linux-x64.tar.gz
            ./thirdbooks
            ```

            ### Windows
            Extract zip and run `thirdbooks.exe`

            ### macOS
            Extract zip and move app to Applications folder

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
