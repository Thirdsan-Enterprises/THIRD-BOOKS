name: Build Desktop Apps (Linux, Windows, macOS)

# TEMPORARILY DISABLED - Re-enable by changing branches back to: [ main, 'claude/**' ]
on:
  push:
    branches: [ disabled-auto-build ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    # Manual trigger still available for when you need to build
    inputs:
      api_url:
        description: 'API Base URL'
        required: false
        default: 'https://api.thirdbooks.com'

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.19.0'
  API_BASE_URL: ${{ github.event.inputs.api_url || secrets.API_URL || 'https://api.thirdbooks.com' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsqlite3-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Initialize Flutter project
        working-directory: desktop
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux --org=com.thirdbooks --project-name=thirdbooks .
          fi

      - name: Configure API endpoint
        working-directory: desktop
        run: |
          if [ -f "lib/core/api/api_client.dart" ]; then
            sed -i "s|http://localhost:8000/api|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
            sed -i "s|http://localhost:8000|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
          fi

      - name: Get dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Generate code
        working-directory: desktop
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Linux
        working-directory: desktop
        run: |
          flutter build linux --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package Linux build
        run: |
          mkdir -p artifacts
          cd desktop/build/linux/x64/release/bundle
          tar -czvf $GITHUB_WORKSPACE/artifacts/thirdbooks-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-linux
          path: artifacts/thirdbooks-linux-x64.tar.gz
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Initialize Flutter project
        working-directory: desktop
        run: |
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows --org=com.thirdbooks --project-name=thirdbooks .
          }

      - name: Configure API endpoint
        working-directory: desktop
        shell: bash
        run: |
          if [ -f "lib/core/api/api_client.dart" ]; then
            sed -i "s|http://localhost:8000/api|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
            sed -i "s|http://localhost:8000|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
          fi

      - name: Get dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Generate code
        working-directory: desktop
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Build Windows
        working-directory: desktop
        run: |
          flutter build windows --release `
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package Windows build
        shell: bash
        run: |
          mkdir -p artifacts
          cd desktop/build/windows/x64/runner/Release
          7z a -tzip $GITHUB_WORKSPACE/artifacts/thirdbooks-windows-x64.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-windows
          path: artifacts/thirdbooks-windows-x64.zip
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Initialize Flutter project
        working-directory: desktop
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos --org=com.thirdbooks --project-name=thirdbooks .
          fi

      - name: Configure API endpoint
        working-directory: desktop
        run: |
          if [ -f "lib/core/api/api_client.dart" ]; then
            sed -i '' "s|http://localhost:8000/api|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
            sed -i '' "s|http://localhost:8000|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
          fi

      - name: Get dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Generate code
        working-directory: desktop
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Install CocoaPods
        working-directory: desktop/macos
        run: pod install || pod install --repo-update
        continue-on-error: true

      - name: Build macOS
        working-directory: desktop
        run: |
          flutter build macos --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package macOS build
        run: |
          mkdir -p artifacts
          cd desktop/build/macos/Build/Products/Release
          zip -r $GITHUB_WORKSPACE/artifacts/thirdbooks-macos.zip *.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-macos
          path: artifacts/thirdbooks-macos.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # ThirdBooks Desktop ${{ github.ref_name }}

            Professional accounting software for Uganda and East Africa.

            ## Downloads

            | Platform | File | Size |
            |----------|------|------|
            | Linux x64 | `thirdbooks-linux-x64.tar.gz` | ~25MB |
            | Windows x64 | `thirdbooks-windows-x64.zip` | ~30MB |
            | macOS | `thirdbooks-macos.zip` | ~35MB |

            ## Features

            - Complete double-entry bookkeeping
            - Multi-currency support (UGX, USD, EUR, KES)
            - Offline-first with cloud sync
            - Financial reports (Trial Balance, P&L, Balance Sheet)
            - Customer & Vendor management
            - Invoice & Bill tracking
            - Professional accounting UI

            ## Installation

            ### Linux
            ```bash
            tar -xzvf thirdbooks-linux-x64.tar.gz
            ./thirdbooks
            ```

            ### Windows
            1. Extract ZIP file
            2. Run `thirdbooks.exe`

            ### macOS
            1. Extract ZIP file
            2. Move `ThirdBooks.app` to Applications
            3. Right-click > Open (first time only)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "========================================"
          echo "  DESKTOP BUILD SUMMARY"
          echo "========================================"
          echo ""
          echo "Linux:   ${{ needs.build-linux.result }}"
          echo "Windows: ${{ needs.build-windows.result }}"
          echo "macOS:   ${{ needs.build-macos.result }}"
          echo ""
          echo "API URL: ${{ env.API_BASE_URL }}"
          echo "Flutter: ${{ env.FLUTTER_VERSION }}"
