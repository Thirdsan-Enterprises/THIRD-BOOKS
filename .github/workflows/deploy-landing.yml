name: Deploy Landing Page & Admin Panel to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual deployment trigger'

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Starting Landing Page & Admin Panel Deployment
        run: |
          echo "============================================"
          echo "  DEPLOYING LANDING PAGE + ADMIN PANEL"
          echo "============================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: List landing page files
        run: |
          echo "Landing page files:"
          ls -laR landing-page/
          echo ""
          du -sh landing-page/

      - name: Deploy Landing Page via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./landing-page/
          server-dir: /thirdbooks.digital/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/README.md

      - name: Prepare Admin Panel for deployment
        run: |
          # Inject database credentials from secrets into admin panel config
          sed -i "s|'your_database_name'|'${{ secrets.DB_DATABASE }}'|g" admin-panel/config/config.php
          sed -i "s|'your_database_user'|'${{ secrets.DB_USERNAME }}'|g" admin-panel/config/config.php
          sed -i "s|'your_database_password'|'${{ secrets.DB_PASSWORD }}'|g" admin-panel/config/config.php

          # Ensure logs and uploads directories exist
          mkdir -p admin-panel/logs
          mkdir -p admin-panel/uploads
          touch admin-panel/logs/.gitkeep
          touch admin-panel/uploads/.gitkeep

          # Create .htaccess to protect sensitive admin panel files
          cat > admin-panel/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              # Block direct access to config directory
              RewriteRule ^config/ - [F,L]

              # Block direct access to src directory
              RewriteRule ^src/ - [F,L]

              # Block direct access to logs
              RewriteRule ^logs/ - [F,L]
          </IfModule>

          # Protect sensitive files
          <FilesMatch "(\.json|\.lock|\.md)$">
              Order allow,deny
              Deny from all
          </FilesMatch>

          Options -Indexes
          EOF

      - name: Deploy Admin Panel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./admin-panel/
          server-dir: /thirdbooks.digital/public_html/admin/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/README.md
            **/composer.json
            **/composer.lock

      - name: Verify Landing Page
        run: |
          echo "Checking landing page..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://thirdbooks.digital" \
            --max-time 30 || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Landing page check PASSED (HTTP $HTTP_STATUS)"
          else
            echo "WARNING: Landing page returned HTTP $HTTP_STATUS"
            echo "Check: https://thirdbooks.digital"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "============================================"
          echo "  DEPLOYMENT COMPLETE"
          echo "============================================"
          echo ""
          echo "Landing Page: https://thirdbooks.digital"
          echo "Admin Panel:  https://thirdbooks.digital/admin/"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"
