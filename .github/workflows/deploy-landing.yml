name: 🚀 Deploy Landing Page to Production

on:
  push:
    branches:
      - main
      - 'claude/thirdbooks-accounting-system-*'
  pull_request:
    branches:
      - main
      - 'claude/thirdbooks-accounting-system-*'
    types: [ closed ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual deployment trigger'

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Run on push to main OR when PR is merged to main (not just closed)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: 🚀 Starting Landing Page Deployment
        run: |
          echo "============================================"
          echo "  🌐 DEPLOYING THIRDBOOKS LANDING PAGE"
          echo "============================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason || 'Automatic deployment' }}"
          echo ""

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to thirdbooks.digital via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./landing-page/
          server-dir: /domains/thirdbooks.digital/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/README.md

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "============================================"
          echo "  ✅ LANDING PAGE DEPLOYED SUCCESSFULLY!"
          echo "============================================"
          echo ""
          echo "🌐 URL: https://thirdbooks.digital"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "⏰ Time: $(date -u)"
          echo ""
          echo "Next steps:"
          echo "  1. Visit https://thirdbooks.digital"
          echo "  2. Verify landing page loads correctly"
          echo "  3. Test all sections and links"
          echo ""
