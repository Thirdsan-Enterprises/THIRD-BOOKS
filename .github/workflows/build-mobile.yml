name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API Base URL'
        required: false
        default: 'https://api.thirdbooks.com'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.19.0'
  API_BASE_URL: ${{ github.event.inputs.api_url || secrets.API_URL || 'https://api.thirdbooks.com' }}

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Initialize Flutter project structure
        working-directory: mobile-admin
        run: |
          # Create Flutter project structure if it doesn't exist
          if [ ! -d "android" ]; then
            echo "Creating Android platform..."
            flutter create --platforms=android --org=com.thirdbooks --project-name=thirdbooks_admin .
          fi

      - name: Configure API endpoint
        working-directory: mobile-admin
        run: |
          # Update API base URL in the api_client.dart
          if [ -f "lib/core/api/api_client.dart" ]; then
            sed -i "s|http://localhost:8000/api|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
            sed -i "s|http://localhost:8000|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
          fi

      - name: Get Flutter dependencies
        working-directory: mobile-admin
        run: flutter pub get

      - name: Generate code (Drift, Freezed, etc.)
        working-directory: mobile-admin
        run: |
          dart run build_runner build --delete-conflicting-outputs || echo "Code generation completed or skipped"

      - name: Build Android APK (Release - Split by ABI)
        working-directory: mobile-admin
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Build Android App Bundle
        working-directory: mobile-admin
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/android
          cp mobile-admin/build/app/outputs/flutter-apk/*.apk artifacts/android/ 2>/dev/null || true
          cp mobile-admin/build/app/outputs/bundle/release/*.aab artifacts/android/ 2>/dev/null || true
          ls -lh artifacts/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-android
          path: artifacts/android/*
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/android/*
          draft: false
          body: |
            ## ThirdBooks Mobile App ${{ github.ref_name }}

            ### Android Downloads
            - `app-arm64-v8a-release.apk` - Modern 64-bit phones (Recommended)
            - `app-armeabi-v7a-release.apk` - Older 32-bit phones
            - `app-x86_64-release.apk` - Emulators/x86 devices
            - `app-release.aab` - Google Play Store upload

            ### Installation
            1. Download the arm64-v8a APK (most devices)
            2. Enable "Install from Unknown Sources"
            3. Install and open ThirdBooks

            ### Features
            - Full offline accounting
            - Multi-currency support (UGX, USD, EUR, KES)
            - Cloud sync when online
            - Reports: Trial Balance, P&L, Balance Sheet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Initialize Flutter project structure
        working-directory: mobile-admin
        run: |
          if [ ! -d "ios" ]; then
            echo "Creating iOS platform..."
            flutter create --platforms=ios --org=com.thirdbooks --project-name=thirdbooks_admin .
          fi

      - name: Configure API endpoint
        working-directory: mobile-admin
        run: |
          if [ -f "lib/core/api/api_client.dart" ]; then
            sed -i '' "s|http://localhost:8000/api|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
            sed -i '' "s|http://localhost:8000|${{ env.API_BASE_URL }}|g" lib/core/api/api_client.dart
          fi

      - name: Get Flutter dependencies
        working-directory: mobile-admin
        run: flutter pub get

      - name: Generate code
        working-directory: mobile-admin
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Install CocoaPods
        working-directory: mobile-admin/ios
        run: |
          pod install || pod install --repo-update

      - name: Build iOS (No Code Sign)
        working-directory: mobile-admin
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Create unsigned IPA
        working-directory: mobile-admin
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../artifacts-ios/ThirdBooks-unsigned.ipa Payload || true
          rm -rf Payload

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/ios
          cp mobile-admin/artifacts-ios/*.ipa artifacts/ios/ 2>/dev/null || echo "IPA not created (needs signing)"
          echo "iOS build completed - requires code signing for distribution" > artifacts/ios/README.txt

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-ios
          path: artifacts/ios/*
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release (iOS)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/ios/*
          body: |
            ## ThirdBooks iOS App ${{ github.ref_name }}

            ### Note
            iOS build requires Apple Developer signing for distribution.
            Contact support for TestFlight access.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "========================================"
          echo "  MOBILE BUILD SUMMARY"
          echo "========================================"
          echo ""
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS: ${{ needs.build-ios.result }}"
          echo ""
          echo "API URL: ${{ env.API_BASE_URL }}"
          echo "Flutter: ${{ env.FLUTTER_VERSION }}"
