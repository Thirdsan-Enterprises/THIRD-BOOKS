name: Build Mobile Apps

on:
  push:
    tags:
      - 'mobile-v*.*.*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile-admin
        run: flutter pub get

      - name: Run code generation (if needed)
        working-directory: mobile-admin
        run: flutter pub run build_runner build --delete-conflicting-outputs || echo "No code generation needed"

      - name: Configure API endpoint
        working-directory: mobile-admin
        run: |
          # Update API base URL to production
          sed -i "s|http://localhost:8000|https://thirdbooks.digital|g" lib/config/api_config.dart || echo "Config updated"

      - name: Build Android APK (Release)
        working-directory: mobile-admin
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (for Play Store)
        working-directory: mobile-admin
        run: flutter build appbundle --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p artifacts/android
          cp mobile-admin/build/app/outputs/flutter-apk/*.apk artifacts/android/ || echo "No APK"
          cp mobile-admin/build/app/outputs/bundle/release/*.aab artifacts/android/ || echo "No AAB"
          ls -lh artifacts/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-mobile-android
          path: artifacts/android/*
          if-no-files-found: error

      - name: Create Release (Android)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/android/*
          draft: false
          prerelease: false
          body: |
            ## ThirdBooks Mobile Admin App ${{ github.ref_name }}

            ### 📱 Android Installation

            **APK Files (Direct Install):**
            - `app-armeabi-v7a-release.apk` - 32-bit ARM devices (older phones)
            - `app-arm64-v8a-release.apk` - 64-bit ARM devices (most modern phones) **← Recommended**
            - `app-x86_64-release.apk` - x86 devices (rare, mostly emulators)

            **AAB File (Google Play Store):**
            - `app-release.aab` - Upload to Google Play Console

            ### 📦 Installation Instructions

            **Option 1: Direct APK Install**
            1. Download the appropriate APK for your device
            2. Enable "Install from Unknown Sources" in Android settings
            3. Tap the downloaded APK to install
            4. Launch "ThirdBooks Admin" from app drawer

            **Option 2: Google Play Store** (Coming Soon)
            - Search for "ThirdBooks" in Play Store
            - Tap Install

            ### 🔗 Backend Connection
            - API: `https://thirdbooks.digital/api/api`
            - Auto-sync with backend when online
            - Offline-capable with local SQLite storage

            ### ✨ Features
            - Real-time tenant monitoring
            - Push notifications for critical events
            - Offline viewing of cached data
            - Biometric authentication support
            - Dark mode support

            ### 📝 Notes
            - Download size: ~20MB
            - Minimum Android version: 7.0 (API 24)
            - Permissions: Internet, Storage (for exports)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: success()
        run: |
          echo "✅ Android app built successfully!"
          echo "📦 APK and AAB artifacts uploaded"
          echo ""
          echo "APK files:"
          ls -lh artifacts/android/*.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile-admin
        run: flutter pub get

      - name: Run code generation (if needed)
        working-directory: mobile-admin
        run: flutter pub run build_runner build --delete-conflicting-outputs || echo "No code generation needed"

      - name: Configure API endpoint
        working-directory: mobile-admin
        run: |
          # Update API base URL to production
          sed -i '' "s|http://localhost:8000|https://thirdbooks.digital|g" lib/config/api_config.dart || echo "Config updated"

      - name: Install CocoaPods dependencies
        working-directory: mobile-admin/ios
        run: pod install

      - name: Build iOS (unsigned)
        working-directory: mobile-admin
        run: |
          flutter build ios --release --no-codesign

      - name: Prepare iOS artifacts
        run: |
          mkdir -p artifacts/ios
          echo "iOS build completed" > artifacts/ios/README.txt
          ls -lh artifacts/ios/ || echo "No IPA (code signing required)"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thirdbooks-mobile-ios
          path: artifacts/ios/*
          if-no-files-found: warn

      - name: Create Release (iOS)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/ios/*
          body: |
            ## ThirdBooks Mobile Admin App ${{ github.ref_name }} - iOS

            ### 📱 iOS Installation

            **IPA File:**
            - `ThirdBooks.ipa` - iOS App Package

            ### 📦 Installation Instructions

            **Option 1: TestFlight (Beta Testing)**
            1. Join TestFlight beta program
            2. Install TestFlight from App Store
            3. Tap invitation link
            4. Install ThirdBooks

            **Option 2: App Store** (Coming Soon)
            - Search for "ThirdBooks" in App Store
            - Tap Get

            **Option 3: Enterprise/Ad-Hoc**
            1. Download IPA file
            2. Use Apple Configurator or Xcode to install
            3. Trust the certificate in Settings → General → Device Management

            ### 🔗 Backend Connection
            - API: `https://thirdbooks.digital/api/api`
            - Auto-sync with backend when online
            - Offline-capable with local storage

            ### ✨ Features
            - Real-time tenant monitoring
            - Push notifications (via APNs)
            - Offline viewing of cached data
            - Face ID / Touch ID support
            - Dark mode support

            ### 📝 Notes
            - Download size: ~25MB
            - Minimum iOS version: 13.0
            - Requires Apple Developer account for distribution

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: success()
        run: |
          echo "✅ iOS build completed!"
          echo "⚠️  Note: iOS built without code signing"
          echo "📝 For App Store distribution, add signing certificates and rebuild"
