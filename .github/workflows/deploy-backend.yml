name: Deploy Backend API to Production

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  pull_request:
    branches:
      - master
      - main
    types: [ closed ]
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run database seeder (first deploy only)'
        required: false
        default: false
        type: boolean
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual deployment trigger'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Starting Backend Deployment
        run: |
          echo "============================================"
          echo "  DEPLOYING THIRDBOOKS BACKEND API"
          echo "============================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysql, pdo_mysql, mbstring, xml, curl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          # Use composer update (not install) since there is no composer.lock
          composer update \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-progress
          composer dump-autoload --optimize --classmap-authoritative

      - name: Create production .env file
        working-directory: backend
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=ThirdBooks
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_TIMEZONE=Africa/Kampala
          LOG_CHANNEL=daily
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          TENANT_DB_CONNECTION=tenant_mysql
          TENANT_DB_HOST=${{ secrets.DB_HOST }}
          TENANT_DB_PORT=3306
          TENANT_DB_USERNAME=${{ secrets.DB_USERNAME }}
          TENANT_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          TENANCY_ENABLED=true
          TENANCY_MODE=single
          CACHE_DRIVER=file
          QUEUE_CONNECTION=database
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SANCTUM_STATEFUL_DOMAINS=${{ secrets.SANCTUM_DOMAINS }}
          SANCTUM_TOKEN_EXPIRATION=1440
          ENVEOF

      - name: Create deploy token file
        working-directory: backend
        run: echo "${{ secrets.DEPLOY_HOOK_SECRET }}" > .deploy-token

      - name: Prepare deployment package
        working-directory: backend
        run: |
          mkdir -p deploy_temp

          # Copy backend source (excluding dev/build files)
          rsync -a \
            --exclude='public' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='deploy_temp' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            . deploy_temp/

          # Flatten public/ into deploy root (DirectAdmin serves from public_html/)
          cp -r public/* deploy_temp/
          cp public/.htaccess deploy_temp/.htaccess

          # Ensure required directories exist
          mkdir -p deploy_temp/storage/framework/{cache/data,sessions,views}
          mkdir -p deploy_temp/storage/logs
          mkdir -p deploy_temp/storage/app/public
          mkdir -p deploy_temp/bootstrap/cache

          find deploy_temp/storage -type d -exec touch {}/.gitkeep \;
          touch deploy_temp/bootstrap/cache/.gitkeep

          # Verify critical files
          echo "=== Deployment package verification ==="
          for f in index.php .htaccess .env artisan bootstrap/app.php; do
            if [ -f "deploy_temp/$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done
          for d in app config vendor routes storage bootstrap/cache; do
            if [ -d "deploy_temp/$d" ]; then
              echo "OK: $d/"
            else
              echo "MISSING: $d/"
              exit 1
            fi
          done
          echo "Total size: $(du -sh deploy_temp/ | cut -f1)"

      - name: Deploy Backend to DirectAdmin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/deploy_temp/
          server-dir: /api.thirdbooks.digital/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**

      - name: Verify API Health
        if: success()
        run: |
          echo "Waiting 15 seconds for server to stabilize..."
          sleep 15

          for i in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/health -w "%{http_code}" \
              "${{ secrets.APP_URL }}/api/health" --max-time 30 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "API health check PASSED (HTTP $HTTP_STATUS)"
              cat /tmp/health
              break
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS - retrying in 10s..."
            sleep 10
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "API not responding yet. Check: ${{ secrets.APP_URL }}/api/health"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "============================================"
          echo "  BACKEND DEPLOYMENT COMPLETE"
          echo "============================================"
          echo "API: ${{ secrets.APP_URL }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"
