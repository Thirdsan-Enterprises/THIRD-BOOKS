name: Deploy Backend API to Production

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  pull_request:
    branches:
      - master
      - main
    types: [ closed ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual deployment trigger'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysql, pdo_mysql, mbstring, xml, curl, zip, bcmath
          coverage: none
          tools: composer:v2

      # .env MUST exist before composer runs (artisan needs APP_KEY)
      - name: Create .env file
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          APP_NAME=ThirdBooks
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_TIMEZONE=Africa/Kampala
          LOG_CHANNEL=daily
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          TENANT_DB_CONNECTION=tenant_mysql
          TENANT_DB_HOST=${{ secrets.DB_HOST }}
          TENANT_DB_PORT=3306
          TENANT_DB_USERNAME=${{ secrets.DB_USERNAME }}
          TENANT_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          TENANCY_ENABLED=true
          TENANCY_MODE=single
          CACHE_DRIVER=file
          QUEUE_CONNECTION=database
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SANCTUM_STATEFUL_DOMAINS=${{ secrets.SANCTUM_DOMAINS }}
          SANCTUM_TOKEN_EXPIRATION=1440
          EOF
          echo ".env created"

      - name: Install dependencies
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache
          composer update \
            --no-dev \
            --no-scripts \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-progress
          composer dump-autoload --optimize --classmap-authoritative
          echo "Dependencies installed. Vendor size: $(du -sh vendor/ | cut -f1)"

      - name: Create deploy token
        working-directory: backend
        run: echo "${{ secrets.DEPLOY_HOOK_SECRET }}" > .deploy-token

      - name: Build deployment package
        working-directory: backend
        run: |
          mkdir -p deploy_temp

          # Copy entire backend
          rsync -a \
            --exclude='public' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='deploy_temp' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            . deploy_temp/

          # Flatten public/ into root (DirectAdmin serves from public_html/)
          cp -r public/* deploy_temp/
          cp public/.htaccess deploy_temp/.htaccess

          # Required writable directories
          mkdir -p deploy_temp/storage/framework/{cache/data,sessions,views}
          mkdir -p deploy_temp/storage/logs
          mkdir -p deploy_temp/storage/app/public
          mkdir -p deploy_temp/bootstrap/cache
          find deploy_temp/storage -type d -exec touch {}/.gitkeep \;
          touch deploy_temp/bootstrap/cache/.gitkeep

          # Verify
          echo "=== Package check ==="
          for f in index.php .htaccess .env artisan; do
            [ -f "deploy_temp/$f" ] && echo "OK $f" || { echo "FAIL $f"; exit 1; }
          done
          for d in app config vendor routes storage; do
            [ -d "deploy_temp/$d" ] && echo "OK $d/" || { echo "FAIL $d/"; exit 1; }
          done
          echo "Size: $(du -sh deploy_temp/ | cut -f1)"

      - name: Deploy to api.thirdbooks.digital
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/deploy_temp/
          server-dir: /api.thirdbooks.digital/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**

      - name: Verify deployment
        if: always()
        run: |
          echo "Backend deployed to: /api.thirdbooks.digital/public_html/"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/health" --max-time 20 2>/dev/null || echo "000")
          echo "Health check: HTTP $HTTP"
