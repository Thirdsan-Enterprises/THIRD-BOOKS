name: Deploy Backend to DirectAdmin

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, mbstring, xml, curl, zip, bcmath, redis
          coverage: none

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          composer dump-autoload --optimize

      - name: Create production .env file
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          APP_NAME=ThirdBooks
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://thirdbooks.digital

          LOG_CHANNEL=stack
          LOG_LEVEL=error

          DB_CONNECTION=pgsql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=5432
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          BROADCAST_DRIVER=log
          CACHE_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          SESSION_DRIVER=file
          SESSION_LIFETIME=120

          FRONTEND_URL=https://thirdbooks.digital
          SANCTUM_STATEFUL_DOMAINS=thirdbooks.digital,www.thirdbooks.digital
          SESSION_DOMAIN=.thirdbooks.digital

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=noreply@thirdbooks.digital
          MAIL_FROM_NAME=ThirdBooks
          EOF

      - name: Prepare deployment package
        working-directory: backend
        run: |
          # Move public folder contents to root for DirectAdmin structure
          mkdir -p deploy_temp

          # Copy all backend files except public folder
          rsync -av --exclude='public' --exclude='node_modules' --exclude='.git' --exclude='tests' --exclude='storage/logs/*' --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' . deploy_temp/

          # Copy public folder contents to root (DirectAdmin needs index.php at api root)
          cp -r public/* deploy_temp/
          cp public/.htaccess deploy_temp/ 2>/dev/null || :

          # Ensure storage directories exist with proper structure
          mkdir -p deploy_temp/storage/framework/{cache,sessions,views}
          mkdir -p deploy_temp/storage/logs
          mkdir -p deploy_temp/storage/app/public
          mkdir -p deploy_temp/bootstrap/cache

          # Create .gitkeep files to preserve empty directories
          find deploy_temp/storage -type d -exec touch {}/.gitkeep \;
          find deploy_temp/bootstrap/cache -type d -exec touch {}/.gitkeep \;

      - name: Deploy to DirectAdmin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DIRECTADMIN_HOST }}
          username: ${{ secrets.DIRECTADMIN_USERNAME }}
          password: ${{ secrets.DIRECTADMIN_PASSWORD }}
          local-dir: ./backend/deploy_temp/
          server-dir: ${{ secrets.DIRECTADMIN_PATH_API }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**

      - name: Run post-deployment commands (SSH)
        if: secrets.SSH_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIRECTADMIN_HOST }}
          username: ${{ secrets.DIRECTADMIN_USERNAME }}
          password: ${{ secrets.DIRECTADMIN_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DIRECTADMIN_PATH_API }}

            # Set permissions
            chmod -R 775 storage bootstrap/cache 2>/dev/null || chmod -R 777 storage bootstrap/cache

            # Run migrations
            php artisan migrate --force

            # Clear and cache config
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Seed currencies if needed (won't duplicate)
            php artisan db:seed --class=CurrencySeeder --force || true

            echo "✅ Backend deployment complete!"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Backend deployed successfully!"
          echo "📍 Location: ${{ secrets.DIRECTADMIN_PATH_API }}"
          echo "🔗 API URL: https://thirdbooks.digital/api/api"
          echo ""
          echo "⚠️  Post-deployment steps (if SSH not available):"
          echo "1. Login to DirectAdmin File Manager"
          echo "2. Set permissions: storage/ and bootstrap/cache/ to 775"
          echo "3. Run via DirectAdmin Terminal or locally:"
          echo "   php artisan migrate --force"
          echo "   php artisan config:cache"
          echo "   php artisan route:cache"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          echo "Check the logs above for details."
