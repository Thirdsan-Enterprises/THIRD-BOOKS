name: Deploy Backend to DirectAdmin

on:
  push:
    branches: [ main ]
    # Removed path filters - deploy on any push to main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Starting Backend Deployment
        run: |
          echo "Building and deploying ThirdBooks Backend API"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysql, pdo_mysql, mbstring, xml, curl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-publish || true

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare composer.json for deployment
        working-directory: backend
        run: |
          cp composer.json composer.json.backup
          # Fix stancl/tenancy version
          sed -i 's/"stancl\/tenancy": "\^4.0"/"stancl\/tenancy": "^3.8"/g' composer.json
          # Remove require-dev section
          php -r '$json = json_decode(file_get_contents("composer.json"), true); unset($json["require-dev"]); file_put_contents("composer.json", json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'

      - name: Install Composer Dependencies
        working-directory: backend
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-progress
          composer dump-autoload --optimize --classmap-authoritative

      - name: Create production .env file
        working-directory: backend
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=ThirdBooks
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_TIMEZONE=Africa/Kampala

          LOG_CHANNEL=stack
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          TENANT_DB_CONNECTION=tenant_mysql
          TENANT_DB_HOST=${{ secrets.DB_HOST }}
          TENANT_DB_PORT=3306
          TENANT_DB_USERNAME=${{ secrets.DB_USERNAME }}
          TENANT_DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          TENANCY_ENABLED=true

          CACHE_DRIVER=file
          QUEUE_CONNECTION=database
          SESSION_DRIVER=file
          SESSION_LIFETIME=120

          SANCTUM_STATEFUL_DOMAINS=${{ secrets.SANCTUM_DOMAINS }}
          ENVEOF

      - name: Prepare deployment package
        working-directory: backend
        run: |
          mkdir -p deploy_temp

          rsync -av \
            --exclude='public' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='composer.json.backup' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            . deploy_temp/

          cp -r public/* deploy_temp/
          [ -f public/.htaccess ] && cp public/.htaccess deploy_temp/ || true

          mkdir -p deploy_temp/storage/framework/{cache,sessions,views}
          mkdir -p deploy_temp/storage/logs
          mkdir -p deploy_temp/storage/app/public
          mkdir -p deploy_temp/bootstrap/cache

          find deploy_temp/storage -type d -exec touch {}/.gitkeep \;

          cat > deploy_temp/DEPLOYMENT_INFO.txt << EOF
          ThirdBooks Backend
          Deployed: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          EOF

      - name: Deploy to DirectAdmin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/deploy_temp/
          server-dir: /domains/api.thirdbooks.digital/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**

      - name: Deployment Summary
        if: success()
        run: |
          echo "============================================"
          echo "  BACKEND DEPLOYED SUCCESSFULLY!"
          echo "============================================"
          echo ""
          echo "API URL: ${{ secrets.APP_URL }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "POST-DEPLOYMENT STEPS:"
          echo "1. SSH: chmod -R 775 storage bootstrap/cache"
          echo "2. SSH: php artisan migrate --force"
          echo "3. SSH: php artisan db:seed --force (first time)"
          echo "4. SSH: php artisan config:cache"
          echo "5. Test: curl ${{ secrets.APP_URL }}/api/health"
