name: Build Windows x64

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.19.0'
  APP_VERSION: '1.0.0'

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Check for windows folder
        working-directory: desktop
        run: |
          if (Test-Path "windows") {
            Write-Host "Windows folder exists"
            Get-ChildItem windows
          } else {
            Write-Host "Windows folder does not exist, creating..."
            flutter create --platforms=windows --org=com.thirdbooks --project-name=thirdbooks .
          }

      - name: Generate app icon
        working-directory: desktop
        shell: pwsh
        run: |
          # Install Magick for SVG to ICO conversion
          choco install imagemagick -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Convert SVG to ICO with multiple sizes for Windows
          $svgPath = "assets/images/icon.svg"
          $icoPath = "assets/images/app_icon.ico"
          $pngPath = "assets/images/app_icon.png"

          # Generate PNG first (256x256)
          magick convert -background none -resize 256x256 $svgPath $pngPath

          # Generate ICO with multiple sizes
          magick convert $pngPath -define icon:auto-resize=256,128,64,48,32,16 $icoPath

          Write-Host "Generated app_icon.ico and app_icon.png"

          # Replace the default Flutter icon in the windows runner
          if (Test-Path "windows/runner/resources") {
            Copy-Item $icoPath "windows/runner/resources/app_icon.ico" -Force
            Write-Host "Replaced windows runner icon"
          }

      - name: Get dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: desktop
        run: |
          Write-Host "Running build_runner for code generation..."
          dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Verify generated files
        working-directory: desktop
        run: |
          Write-Host "Checking for generated files..."
          if (Test-Path "lib/core/database/app_database.g.dart") {
            Write-Host "Database generated file exists"
          } else {
            Write-Host "WARNING: Database generated file not found"
          }

      - name: Build Windows Release
        working-directory: desktop
        run: |
          flutter build windows --release

      - name: List build output
        working-directory: desktop
        run: |
          Write-Host "Build output structure:"
          Get-ChildItem -Recurse build/windows/x64/runner/Release | Select-Object FullName

      - name: Create installer with Inno Setup
        working-directory: desktop
        shell: pwsh
        run: |
          # Inno Setup is pre-installed on windows-latest runners
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
            # Try alternate location
            $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $innoPath)) {
            Write-Host "Installing Inno Setup..."
            choco install innosetup -y --no-progress
            $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          Write-Host "Using Inno Setup at: $innoPath"

          # Create output directory
          New-Item -ItemType Directory -Path "build/installer" -Force

          # Run Inno Setup compiler
          & $innoPath "installer/thirdbooks_setup.iss"

          Write-Host "Installer created:"
          Get-ChildItem "build/installer"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ThirdBooks-Setup-x64
          path: desktop/build/installer/ThirdBooks-Setup-${{ env.APP_VERSION }}-x64.exe
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          Write-Host "========================================"
          Write-Host "  WINDOWS BUILD COMPLETE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Artifact: ThirdBooks-Setup-${{ env.APP_VERSION }}-x64.exe"
          Write-Host "Platform: Windows x64"
          Write-Host "Flutter:  ${{ env.FLUTTER_VERSION }}"
          Write-Host "Output:   Single installer (.exe)"
          Write-Host ""
