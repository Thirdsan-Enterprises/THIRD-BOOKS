name: Deploy Frontend to DirectAdmin

on:
  push:
    branches: [ main, claude/analyze-repo-1S9n8 ]
    paths:
      - 'web-app/**'
      - '.github/workflows/deploy-frontend.yml'
      - '!web-app/src-tauri/**'  # Don't trigger on desktop app changes
  workflow_dispatch:  # Allow manual trigger
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Cancel in-progress deployments for the same branch
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🚀 Starting Frontend Deployment
        run: |
          echo "🎨 Building and deploying ThirdBooks Web App"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: 📥 Install dependencies
        working-directory: web-app
        run: |
          echo "Installing npm dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed successfully"

      - name: 🔐 Create production .env
        working-directory: web-app
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=https://thirdbooks.digital/api/api
          VITE_APP_NAME=ThirdBooks
          VITE_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
          VITE_APP_ENV=production
          EOF

          echo "✅ Production .env file created"
          cat .env

      - name: 🔨 Build frontend
        working-directory: web-app
        run: |
          echo "Building Vue application for production..."
          npm run build
          echo "✅ Build completed successfully"

          echo "📊 Build output size:"
          du -sh dist/
          echo ""
          echo "📁 Build contents:"
          ls -lah dist/ | head -20

      - name: 📝 Create .htaccess for SPA routing
        working-directory: web-app/dist
        run: |
          cat > .htaccess << 'EOF'
          # ThirdBooks Production .htaccess
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Force HTTPS
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

            # Don't rewrite if file/directory exists
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d

            # Don't rewrite API calls
            RewriteCond %{REQUEST_URI} !^/api/

            # Rewrite everything else to index.html (SPA)
            RewriteRule ^ /index.html [L]
          </IfModule>

          # Cache static assets
          <IfModule mod_expires.c>
            ExpiresActive On

            # Images - 1 year
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/x-icon "access plus 1 year"

            # Fonts - 1 year
            ExpiresByType font/ttf "access plus 1 year"
            ExpiresByType font/otf "access plus 1 year"
            ExpiresByType font/woff "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType application/font-woff "access plus 1 year"

            # CSS and JavaScript - 1 month
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType text/javascript "access plus 1 month"

            # No cache for HTML and JSON
            ExpiresByType application/json "access plus 0 seconds"
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>

          # Compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE text/javascript
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/json
            AddOutputFilterByType DEFLATE image/svg+xml
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE text/xml
          </IfModule>

          # Security headers
          <IfModule mod_headers.c>
            # Prevent MIME type sniffing
            Header set X-Content-Type-Options "nosniff"

            # Clickjacking protection
            Header set X-Frame-Options "SAMEORIGIN"

            # XSS Protection
            Header set X-XSS-Protection "1; mode=block"

            # Referrer Policy
            Header set Referrer-Policy "strict-origin-when-cross-origin"

            # Remove X-Powered-By header
            Header unset X-Powered-By

            # Content Security Policy (adjust as needed)
            Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://thirdbooks.digital https://api.exchangerate-api.com"
          </IfModule>

          # Block access to sensitive files
          <FilesMatch "(^\..*|composer\.json|composer\.lock|package\.json|package-lock\.json|\.env|\.git)">
            Order allow,deny
            Deny from all
          </FilesMatch>

          # Disable directory browsing
          Options -Indexes

          # Error documents (optional)
          ErrorDocument 404 /index.html
          ErrorDocument 403 /index.html
          EOF

          echo "✅ .htaccess created with production optimizations"

      - name: 📝 Create robots.txt
        working-directory: web-app/dist
        run: |
          cat > robots.txt << 'EOF'
          User-agent: *
          Allow: /

          # Disallow admin paths
          Disallow: /admin/
          Disallow: /api/

          Sitemap: https://thirdbooks.digital/sitemap.xml
          EOF

          echo "✅ robots.txt created"

      - name: 📝 Create deployment info
        working-directory: web-app/dist
        run: |
          cat > DEPLOYMENT_INFO.txt << 'EOF_INFO'
          ThirdBooks Frontend Deployment
          ===============================
          Deployed: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Workflow: ${{ github.run_number }}
          Build Version: ${{ github.ref_name }}-${{ github.run_number }}
          EOF_INFO

          echo "✅ Deployment info created"

      - name: 📍 Calculate deployment path
        id: deploy-path
        run: |
          # Auto-append /public_html to the deployment path for DirectAdmin
          BASE_PATH="${{ secrets.DIRECTADMIN_PATH_WEB }}"

          # Remove trailing slash if present
          BASE_PATH="${BASE_PATH%/}"

          # Append /public_html
          FULL_PATH="${BASE_PATH}/public_html"

          echo "deployment-path=${FULL_PATH}" >> $GITHUB_OUTPUT
          echo "📍 Base path: ${BASE_PATH}"
          echo "📍 Full deployment path: ${FULL_PATH}"

      - name: 🚀 Deploy to DirectAdmin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DIRECTADMIN_HOST }}
          username: ${{ secrets.DIRECTADMIN_USERNAME }}
          password: ${{ secrets.DIRECTADMIN_PASSWORD }}
          local-dir: ./web-app/dist/
          server-dir: ${{ steps.deploy-path.outputs.deployment-path }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
            **/.DS_Store
            **/Thumbs.db

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║  ✅ FRONTEND DEPLOYED SUCCESSFULLY!                    ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📍 Deployment Location: ${{ steps.deploy-path.outputs.deployment-path }}"
          echo "🔗 URL: https://thirdbooks.digital"
          echo "📅 Deployed: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🏗️  Build: ${{ github.ref_name }}-${{ github.run_number }}"
          echo ""
          echo "🧪 TESTING CHECKLIST:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "1️⃣  Visit https://thirdbooks.digital"
          echo "2️⃣  Check login page loads correctly"
          echo "3️⃣  Test login with super admin credentials"
          echo "4️⃣  Navigate to /admin to verify admin portal"
          echo "5️⃣  Open browser console (F12) and check for errors"
          echo "6️⃣  Test API connectivity from Network tab"
          echo "7️⃣  Verify HTTPS is enforced"
          echo "8️⃣  Test responsive design on mobile"
          echo ""
          echo "🔗 Important URLs:"
          echo "   - Home: https://thirdbooks.digital"
          echo "   - Admin: https://thirdbooks.digital/admin"
          echo "   - API: https://thirdbooks.digital/api/api"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║  ❌ FRONTEND DEPLOYMENT FAILED!                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📅 Failed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""
          echo "🔍 Check the logs above for details."
          echo "💡 Common issues:"
          echo "   - FTP credentials incorrect"
          echo "   - Server path doesn't exist"
          echo "   - Build failed (check npm dependencies)"
          echo "   - Node.js version mismatch"
          echo "   - Out of memory during build"
          echo ""
          exit 1
