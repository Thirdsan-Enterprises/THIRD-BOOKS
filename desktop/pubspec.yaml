name: thirdbooks
description: MagicBet Accounting — Always-Online Web App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^13.0.0

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.0
  pretty_dio_logger: ^1.3.1

  # Web-compatible Persistent Storage (replaces local file I/O)
  shared_preferences: ^2.2.0

  # Secure Storage (has web support via localStorage)
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Charts & Graphs
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

  # Data Tables
  pluto_grid: ^7.0.0

  # PDF Generation & Printing
  pdf: ^3.10.0
  printing: ^5.11.0

  # Excel Export
  excel: ^4.0.0

  # Date & Time
  intl: ^0.18.1

  # Utilities
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  logger: ^2.0.2+1
  uuid: ^4.3.3
  collection: ^1.18.0

  # File Picker & CSV (web-compatible)
  file_picker: ^6.1.0
  csv: ^6.0.0

  # HTTP client (used for fetching attachment bytes for print/preview)
  http: ^1.2.0

  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.0

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/outlet_data.json
